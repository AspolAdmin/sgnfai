<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sgnfai · Prototype 3</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/proto.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  /* Prototype 3: one background idea, made visible. Full blue field; scattered points (raw alerts)
     are swept up and sorted into columns (categories), held, then released back to noise. */
  body.p3 { background: var(--blue); color: var(--white); }
  #field { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .p3 header, .p3 main, .p3 footer { position: relative; z-index: 1; }

  .p3-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px var(--gutter); }
  .p3-top .bar__logo { font-size: 24px; }

  .p3-hero { flex: 1; display: flex; flex-direction: column; padding: 48px var(--gutter); }
  .p3-hero::before { content: ""; flex: 1; }
  .p3-hero::after { content: ""; flex: 3; }
  .p3-hero .logo { font-size: clamp(64px, 12vw, 160px); }
  .p3-hero .logo__cursor { background: var(--white); }
  .p3-hero .tagline { margin-top: 28px; font-size: clamp(20px, 2.6vw, 34px); }
  .p3-hero .lede { margin-top: 20px; max-width: 42ch; font-size: 18px; color: rgba(255, 255, 255, 0.8); }
  .p3-hero .actions { margin-top: 32px; }
  .p3-hero .textlink:hover { color: var(--white); opacity: 0.8; }
  .p3 :focus-visible { outline-color: var(--white); }
</style>
</head>
<body class="p3">
<canvas id="field" aria-hidden="true"></canvas>

<header class="p3-top">
  <a class="bar__logo" href="/">Sgnfai</a>
  <a class="btn btn--light btn--sm" href="mailto:hello@sgnf.ai?subject=Request%20access">Request access</a>
</header>

<main class="p3-hero">
  <div class="logo" data-type-logo data-autoplay data-hero role="img" aria-label="Sgnfai"><span class="logo__word" aria-hidden="true">Sgnfai</span><span class="logo__cursor" aria-hidden="true"></span></div>
  <h1 class="tagline" data-hero><span>Our tools.</span><span>Your intelligence.</span><span>Their advantage.</span></h1>
  <p class="lede" data-hero>Industrial-strength web collection that detects every alert, classifies and synthesises it, and delivers it straight into your data product via API or MCP.</p>
  <div class="actions" data-hero>
    <a class="btn btn--light" href="mailto:hello@sgnf.ai?subject=Request%20access">Request access</a>
    <a class="textlink" href="mailto:hello@sgnf.ai?subject=Technical%20call">Book a technical call</a>
  </div>
</main>

<footer class="foot foot--light">
  <nav class="foot__nav" aria-label="Prototypes"><a href="/1/">1</a><span>|</span><a href="/2/">2</a><span>|</span><a href="/3/" aria-current="page">3</a></nav>
  <span>&copy; 2026 Sgnfai</span>
</footer>

<script src="/proto.js"></script>
<script>
(function () {
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv = document.getElementById('field'), ctx = cv.getContext('2d');

  var GAP = 7, SIZE = 3, PER_ROW = 2, STRIDE = PER_ROW * GAP + 8;   // CSS px
  var PHASE = { scatter: 2.5, sweep: 2.6, hold: 3.4, release: 3 };  // seconds

  var W = 0, H = 0, dpr = 1, hero = null, area = null, cols = 0, maxRows = 0;
  var dots = [], phase = 'scatter', phaseStart = 0, sweepX = -1, last = 0, started = false;

  function rand(a, b) { return a + Math.random() * (b - a); }

  function heroRect() {
    var r = null, range = document.createRange();
    document.querySelectorAll('[data-hero]').forEach(function (el) {
      range.selectNodeContents(el);             // the text itself, not the full-width block box
      var b = range.getBoundingClientRect();
      if (!b.height) return;                    // the logo may be mid-typing (narrow), its height still counts
      r = r ? { l: Math.min(r.l, b.left), t: Math.min(r.t, b.top), r: Math.max(r.r, b.right), b: Math.max(r.b, b.bottom) }
            : { l: b.left, t: b.top, r: b.right, b: b.bottom };
    });
    return r;
  }
  // 0.2 inside the text area, back to 1 over 90px
  function heroFactor(x, y) {
    if (!hero) return 1;
    var dx = Math.max(hero.l - 16 - x, 0, x - hero.r - 16), dy = Math.max(hero.t - 16 - y, 0, y - hero.b - 16);
    var f = Math.min(1, Math.sqrt(dx * dx + dy * dy) / 90);
    return 0.2 + 0.8 * f;
  }

  // where the bars go: right of the text on wide screens, under it on narrow ones
  function layoutArea() {
    var mobile = W < 760, bottom = H - 64;
    if (!mobile) {
      var l = Math.max(hero ? hero.r + 64 : 0, W * 0.52);
      if (W - 32 - l < 200) l = W * 0.52;
      area = { l: l, r: W - 32, t: Math.max(110, bottom - H * 0.62), b: bottom };
    } else {
      area = { l: 16, r: W - 16, t: Math.max(hero ? hero.b + 24 : H * 0.6, bottom - H * 0.3), b: bottom };
    }
    cols = Math.max(4, Math.floor((area.r - area.l + 8) / STRIDE));
    maxRows = Math.max(3, Math.floor((area.b - area.t) / GAP));
  }

  // give each dot a slot in a column; column heights follow a smooth random profile; leftovers stay noise
  function assignTargets() {
    var w = [], sum = 0, max = 0, seed = rand(0, 10);
    for (var c = 0; c < cols; c++) {
      w[c] = 0.2 + Math.pow(Math.abs(Math.sin(c * 0.42 + seed) + 0.6 * Math.sin(c * 1.27 + seed * 2)), 1.6) + rand(0, 0.25);
      sum += w[c]; max = Math.max(max, w[c]);
    }
    // the tallest column fills 85% of the area, unless there are too few dots for that
    var cap = maxRows * PER_ROW, order = dots.slice();
    var sortable = Math.min(Math.round(dots.length * 0.8), Math.round(cap * 0.85 * sum / max));
    for (var i = order.length - 1; i > 0; i--) { var j = (Math.random() * (i + 1)) | 0, t = order[i]; order[i] = order[j]; order[j] = t; }
    order.forEach(function (d) { d.k = -1; });
    var n = 0;
    for (c = 0; c < cols; c++) {
      var count = Math.min(cap, Math.round(sortable * w[c] / sum));
      for (var k = 0; k < count && n < order.length; k++, n++) {
        var d = order[n];
        d.k = k;
        d.tx = area.l + c * STRIDE + (k % PER_ROW) * GAP;
        d.ty = area.b - SIZE - Math.floor(k / PER_ROW) * GAP;
      }
    }
  }

  function build() {
    W = innerWidth; H = innerHeight;
    if (!W || !H) return;                       // hidden or zero-sized: wait for a resize
    dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    hero = heroRect();
    layoutArea();
    // enough dots for bars of roughly half the area on average, plus 25% that stays noise
    var count = Math.min(W < 760 ? 520 : 1400, Math.round(cols * maxRows * PER_ROW * 0.85 * 0.5 * 1.25));
    dots = [];
    for (var i = 0; i < count; i++) dots.push({ x: rand(0, W), y: rand(0, H), ph: rand(0, 6.3), sorted: false, moving: false, k: -1 });
    assignTargets();
    phase = 'scatter'; sweepX = -1; phaseStart = performance.now() / 1000;
    if (reduced) { dots.forEach(function (d) { if (d.k >= 0) { d.x = d.tx; d.y = d.ty; d.sorted = true; } }); render(0); }
    if (!reduced && !started) { started = true; requestAnimationFrame(frame); }
  }

  function fly(d, x, y, now, dur, delay) {
    d.fx = d.x; d.fy = d.y; d.gx = x; d.gy = y; d.t0 = now + delay; d.dur = dur; d.moving = true;
  }
  function ease(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }

  function update(now, dt) {
    var e = now - phaseStart;
    if (phase === 'scatter' && e > PHASE.scatter) { phase = 'sweep'; phaseStart = now; }
    else if (phase === 'sweep') {
      sweepX = (e / PHASE.sweep) * (W + 40);
      dots.forEach(function (d) {
        if (!d.sorted && d.k >= 0 && d.x <= sweepX) { fly(d, d.tx, d.ty, now, 1.1, 0); d.sorted = true; }
      });
      if (e > PHASE.sweep) { phase = 'hold'; phaseStart = now; sweepX = -1; }
    } else if (phase === 'hold' && e > PHASE.hold) {
      phase = 'release'; phaseStart = now;
      dots.forEach(function (d) { if (d.sorted) { fly(d, rand(0, W), rand(0, H), now, 1.8, rand(0, 1)); d.sorted = false; } });
    } else if (phase === 'release' && e > PHASE.release) { phase = 'scatter'; phaseStart = now; assignTargets(); }

    dots.forEach(function (d) {
      if (d.moving) {
        var p = (now - d.t0) / d.dur;
        if (p < 0) return;
        if (p >= 1) { p = 1; d.moving = false; }
        var q = ease(p);
        d.x = d.fx + (d.gx - d.fx) * q; d.y = d.fy + (d.gy - d.fy) * q; d.q = q;
      } else if (!d.sorted) {                   // slow drift for the noise
        d.x += Math.sin(now * 0.4 + d.ph) * dt * 5;
        d.y += Math.cos(now * 0.33 + d.ph * 1.3) * dt * 5;
      }
    });
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    var settled = 0, sortable = 0;
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i], a;
      if (d.k >= 0) sortable++;
      if (d.sorted && !d.moving) { a = 0.95; settled++; }
      else if (d.sorted) a = 0.3 + 0.65 * (d.q || 0);
      else a = 0.3 * heroFactor(d.x, d.y);
      ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
      ctx.fillRect(d.x, d.y, SIZE, SIZE);
    }

    // baseline and label fade in as the columns settle
    var f = sortable ? settled / sortable : 0;
    if (f > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.6 * f).toFixed(3) + ')';
      ctx.fillRect(area.l, area.b + 6, cols * STRIDE - 8, 1);
      ctx.font = '11px ui-monospace, "SF Mono", Menlo, monospace';
      ctx.textBaseline = 'top';
      ctx.fillText('ALERTS BY CATEGORY · SAMPLE', area.l, area.b + 14);
    }
    if (sweepX >= 0) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(sweepX, 0, 1, H); }
  }

  function frame(ms) {
    var now = ms / 1000, dt = last ? Math.min(0.05, now - last) : 0;
    last = now;
    if (W) { update(now, dt); render(); }
    requestAnimationFrame(frame);
  }

  var timer = 0;
  addEventListener('resize', function () { clearTimeout(timer); timer = setTimeout(build, 150); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
  build();
})();
</script>
</body>
</html>
