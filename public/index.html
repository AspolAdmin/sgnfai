<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sgnfai</title>
<meta name="description" content="Data- and AI-first services empowering our clients to deliver smarter solutions to the businesses they serve.">
<meta property="og:title" content="Sgnfai">
<meta property="og:description" content="Our tools. Your intelligence. Their advantage.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sgnf.ai/">

<link rel="stylesheet" href="./style.css">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<script>document.documentElement.classList.add('js');</script>
</head>
<body>

<header class="strip">
  <a href="/" class="strip__logo" aria-label="Sgnfai"><span class="logo__word" aria-hidden="true">Sgnfai</span><span class="logo__cursor" aria-hidden="true"></span></a>
  <a href="mailto:hello@sgnf.ai">hello@sgnf.ai</a>
</header>

<main class="stage">
  <div class="logo" id="logo" role="img" aria-label="Sgnfai">
    <span class="logo__word" aria-hidden="true">Sgnfai</span><span class="logo__cursor" aria-hidden="true"></span>
  </div>

  <div class="reveal" id="reveal">
    <p class="dict"><b>Sgnfai</b> <span class="dict__ipa">/ˈsɪɡ.nɪ.faɪ/</span> <span class="dict__say">“SIG-nuh-fy”</span></p>
    <h1 class="tagline">
      <span>Our tools.</span>
      <span>Your intelligence.</span>
      <span>Their advantage.</span>
    </h1>
    <p class="lede">Data- and AI-first services empowering our clients to deliver smarter solutions to the businesses they serve.</p>
  </div>
</main>

<p class="copyright">&copy; 2026 Sgnfai</p>

<script>
  // logo animation: Signify -> Signifai -> Sgnifai -> Sgnfai -> Sgnf.ai -> Sgnfai (the dot comes out last).
  // Each logo has its own independent animation. Header: only on click. Main: once on load, once per click.
  (function () {
    var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

    function typer(el) {
      var w = el.querySelector('.logo__word'), c = el.querySelector('.logo__cursor');
      var s = 'Sgnfai', p = 6, run = 0;

      // each wait belongs to a run; a newer run makes older ones bail out
      function wait(ms, id) {
        return new Promise(function (ok, stop) {
          setTimeout(function () { id === run ? ok() : stop('stale'); }, ms);
        });
      }

      function draw() {
        w.textContent = s;
        var x = 0;
        if (w.firstChild && p > 0) {
          var r = document.createRange();
          r.setStart(w.firstChild, 0); r.setEnd(w.firstChild, p);
          x = r.getBoundingClientRect().width;
        }
        c.style.left = x + 'px';
      }

      async function play(id) {
        async function step(v, q, ms) { s = v; p = q; draw(); await wait(ms, id); }
        c.style.opacity = 1;
        await step('', 0, 600);
        var d = [180, 120, 250, 160, 310, 140, 1000];
        for (var i = 1; i <= 7; i++) await step('Signify'.slice(0, i), i, d[i - 1]);
        await step('Signif', 6, 360);
        await step('Signifa', 7, 200);
        await step('Signifai', 8, 850);
        for (i = 7; i >= 2; i--) await step(s, i, [140, 230, 100, 190][i % 4]);
        await step('Sgnifai', 1, 580);
        for (i = 2; i <= 4; i++) await step(s, i, [180, 250, 120][i % 3]);
        await step('Sgnfai', 3, 750);
        await step(s, 4, 420);
        await step('Sgnf.ai', 5, 1400);
        await step('Sgnfai', 4, 600);
        await step(s, 5, 150);
        await step(s, 6, 220);
        c.style.opacity = 0; await wait(300, id);
        c.style.opacity = 1; await wait(450, id);
        c.style.opacity = 0;
      }

      async function start(times) {
        var id = ++run;
        try {
          for (var n = 0; n < times; n++) {
            if (n) await wait(4000, id);
            await play(id);
          }
        } catch (e) { /* superseded by a newer run */ }
      }

      window.addEventListener('resize', draw);
      el.addEventListener('click', function (e) {
        e.preventDefault();
        if (!reduced) start(1);
      });
      return start;
    }

    var main = typer(document.getElementById('logo'));
    typer(document.querySelector('.strip__logo'));

    // unfold the text right away: dictionary line, tagline, then description (staggered in CSS)
    requestAnimationFrame(function () { document.getElementById('reveal').classList.add('is-shown'); });

    if (!reduced) main(1);
  })();
</script>
</body>
</html>
